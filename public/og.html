<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>OG</title>
    <style>
      @font-face {
        font-family: Display;
        src: url("./og-assets/archivo-black-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: Mono;
        src: url("./og-assets/geist-mono-latin-wght-normal.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #12110c;
      }
      .frame {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 44px 52px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border: 14px solid #12110c;
        background: #f2efe6;
        color: #12110c;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: Mono, ui-monospace, monospace;
        font-size: 16px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        background: #c9f24e;
        font-family: Display, sans-serif;
        font-size: 20px;
        letter-spacing: 0;
      }
      h1 {
        margin: 0;
        font-family: Display, "Arial Black", sans-serif;
        font-size: 52px;
        line-height: 0.94;
        text-transform: uppercase;
        letter-spacing: -0.02em;
      }
      .accent {
        background: #c9f24e;
        padding: 0 8px;
      }
      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 24px;
        font-family: Mono, ui-monospace, monospace;
        font-size: 15px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="top">
        <span>Guilherme</span>
        <span class="mark">G</span>
      </div>
      <h1>
        Se uma pessoa precisa<br />
        fazer isso todo dia,<br />
        <span class="accent">talvez o computador</span><br />
        deveria.
      </h1>
      <div class="bottom">
        <span>Software · Automation · Web · AI</span>
        <span>Problema → software</span>
      </div>
    </div>
  </body>
</html>
